services:
  mysql:
    image: mysql:8.4
    container_name: goliath-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in api/.env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in api/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in api/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in api/.env}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
